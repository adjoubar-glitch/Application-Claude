<style>
/* Layout: a single dark workshop column under a fixed header, large rounded tiles, five-tab bottom bar. Single dark look by choice. */
:root { color-scheme:dark;
  --bg:#17120F; --bar:#241C18; --card:#2A2320; --tile:#3A2F2B; --sunk:#1F1916; --line:#6B5F58; --fg:#F3E7DD; --muted:#CBBBAF;

  --font:"Roboto","Segoe UI",system-ui,sans-serif; }
* { box-sizing:border-box }
html,body { margin:0 } img { max-width:100% } [hidden] { display:none!important }

:focus-visible { outline:2px solid var(--gold); outline-offset:2px }
svg { display:block; fill:currentColor }
.top { position:sticky; top:env(safe-area-inset-top,0px); z-index:6; background:var(--bar); display:flex; align-items:center; gap:10px; padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px)) }
.logo { width:44px; height:44px; flex:none; border-radius:50%; background:var(--amber); color:#fff; display:grid; place-items:center; border:0 }
.tt { min-width:0; flex:1 } .tt b { display:block; font-size:1.15rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.role { display:inline-flex; gap:5px; align-items:center; background:var(--brown-soft); color:var(--amber); font-size:.78rem; font-weight:500; border-radius:6px; padding:2px 8px }
.ic { width:42px; height:42px; flex:none; display:grid; place-items:center; border:0; background:none; border-radius:50% }
.ic.ok { color:var(--ok) } .ic.bad { color:var(--bad) }
#main { display:grid; gap:18px; max-width:680px; margin:0 auto; padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px)); min-width:0 }
#main > * { min-width:0 }
.hero { position:relative; margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))); background:var(--brown-soft) url("hero.jpg") top center/cover no-repeat; padding:96px 16px 14px; min-height:210px; display:grid; align-content:end; justify-items:start; gap:6px }
.hero::before { content:""; position:absolute; inset:0; background:linear-gradient(to bottom,transparent 25%,rgba(23,18,15,.88) 85%,var(--bg)) }
.hero > * { position:relative }
.hero .tag { background:var(--amber); color:#fff; font-size:.75rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; border-radius:99px; padding:5px 14px; display:flex; gap:6px; align-items:center }
.hero h2 { font-size:2.2rem; font-weight:900 } .hero p { margin:0; font-size:.95rem }
.panel { background:var(--card); border-radius:24px; padding:18px; display:grid; gap:12px; min-width:0 }
.panel.tile2 { background:var(--tile) } .panel.slate { background:var(--slate) } .panel.gold { background:var(--deep) } .panel.ok { background:var(--ok-soft) } .panel.warn { background:var(--brown-soft) } .panel.bad { background:var(--bad-soft) }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center } .between { justify-content:space-between } .nw { flex-wrap:nowrap } .grow { flex:1 1 0; min-width:0 }
.muted { color:var(--muted) } .small { font-size:.875rem } .eyebrow { font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; font-weight:700; color:var(--gold) }
.round { width:48px; height:48px; flex:none; border-radius:50%; display:grid; place-items:center }
.tiles { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px }

.btn.primary { background:var(--gold); color:var(--gold-ink); border-color:var(--gold); font-weight:700 } .btn.brown { background:var(--brown); border-color:var(--brown); color:#FFD9A8 }
.btn.link { border:0; padding:6px 0; min-height:0; text-decoration:underline; border-radius:0 } .btn:disabled { opacity:.5 }
.btn.block { flex:1 1 140px }

label.f { display:grid; gap:5px; font-size:.875rem; font-weight:500; min-width:0 }
.chips { display:flex; gap:8px; overflow-x:auto; padding:2px; scrollbar-width:none }
.chip { flex:none; background:none; border:1px solid var(--line); border-radius:10px; padding:9px 16px; font-weight:500 }
.chip[aria-pressed="true"] { background:var(--deep); border-color:var(--deep); color:#FFD9A8 }
.pill { display:inline-block; font-size:.78rem; font-weight:500; border-radius:7px; padding:3px 10px; white-space:nowrap }
.pill.ok { background:var(--ok-soft); color:var(--ok) } .pill.warn { background:var(--brown-soft); color:var(--gold) } .pill.bad { background:var(--bad-soft); color:var(--bad) } .pill.plain { background:var(--tile); color:var(--muted) }
.rec { width:100%; display:flex; gap:12px; align-items:center; background:var(--card); border:0; text-align:left; border-radius:20px; padding:14px; min-width:0 }
.rec img { width:70px; height:50px; object-fit:cover; border-radius:10px; flex:none; background:#fff }
.rec b { display:block; font-weight:700; overflow-wrap:anywhere } .rec span.s { display:block; color:var(--muted); font-size:.85rem }
.step { display:grid; grid-template-columns:48px minmax(52px,1fr) 48px; gap:8px; align-items:stretch; flex:0 1 190px; min-width:150px }
.step button { background:var(--brown); border:0; border-radius:50%; height:48px; font-size:1.5rem; font-weight:500 }
.step input,.step output { background:var(--deep); border:0; border-radius:14px; text-align:center; font-weight:700; font-size:1.3rem; padding:4px; min-height:48px; display:grid; place-items:center }
.preset { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:6px }
.preset button { background:none; border:1px solid var(--line); border-radius:99px; color:var(--gold); padding:9px 0; font-weight:500; min-width:0 }
.preset button[aria-pressed="true"] { background:var(--gold); border-color:var(--gold); color:var(--gold-ink); font-weight:700 }
.opt { width:100%; display:flex; gap:12px; align-items:center; background:var(--tile); border:0; border-radius:14px; padding:13px 14px; text-align:left }
.opt i { flex:none; width:22px; height:22px; border-radius:50%; border:2px solid var(--muted); display:grid; place-items:center }
.opt span.l { flex:1; min-width:0; overflow-wrap:anywhere } .opt span.r { flex:none; font-size:.82rem; color:var(--muted) }
.opt[aria-pressed="true"] { background:var(--deep); color:#FFD9A8; font-weight:700 } .opt[aria-pressed="true"] i { border-color:var(--gold) } .opt[aria-pressed="true"] i::after { content:""; width:12px; height:12px; border-radius:50%; background:var(--gold) } .opt[aria-pressed="true"] span.r { color:#FFD9A8; font-weight:400 }
.factor { background:var(--brown-soft); border-radius:14px; padding:12px 14px } .factor b { color:var(--amber); font-size:1.1rem; display:block }
details.block { background:var(--tile); border-radius:18px; overflow:hidden }
details.block > summary { cursor:pointer; padding:14px 16px; font-weight:700; display:flex; justify-content:space-between; gap:10px; align-items:baseline }
.ing { display:grid; grid-template-columns:24px minmax(0,1fr) auto; gap:3px 10px; align-items:start; padding:11px 16px; border-top:1px solid rgba(203,187,175,.18); cursor:pointer }
.ing input { width:20px; height:20px; min-height:0; margin:2px 0 0; accent-color:var(--amber) }
.ing .q { font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--gold) } .ing .n { overflow-wrap:anywhere } .ing .t { grid-column:2 / 4; font-size:.82rem; color:var(--muted) }
.ing.done .n,.ing.done .q { text-decoration:line-through; opacity:.55 }
ol.steps { margin:0; padding:0; list-style:none; display:grid; gap:14px } ol.steps li { display:grid; gap:3px } ol.steps b { color:var(--gold) }
.schema { width:100%; border-radius:16px; background:#fff; display:block; max-width:100% }
.layer { display:grid; grid-template-columns:14px minmax(0,1fr); gap:10px; width:100%; background:none; border:1px solid transparent; border-radius:12px; padding:8px; text-align:left } .layer i { border-radius:4px; min-height:32px; background:var(--tile) }
button.layer { cursor:pointer } button.layer[aria-pressed="true"] { background:var(--brown-soft); border-color:var(--gold) }
.shot { position:sticky; top:calc(70px + env(safe-area-inset-top,0px)); z-index:3; border-radius:16px; overflow:hidden; background:#fff; line-height:0 }
.shot img { width:100%; display:block } .shot svg { position:absolute; inset:0; width:100%; height:100%; fill:none } .shot svg rect.hit { fill:transparent; cursor:pointer; pointer-events:all }
.shot .ring { stroke:var(--amber); stroke-width:5; fill:none } .shot .boxh { stroke:var(--amber); stroke-width:4; fill:none }
@media (prefers-reduced-motion:no-preference) { .shot .ring { animation:pulse 1.2s ease-in-out infinite } @keyframes pulse { 50% { stroke-width:9; opacity:.6 } } }
.buy { display:flex; gap:8px; flex-wrap:wrap } .buy a { display:inline-flex; gap:6px; align-items:center; padding:7px 12px; border:1px solid var(--line); border-radius:10px; text-decoration:none; font-size:.85rem; font-weight:500 } .buy a.best { border-color:var(--ok); color:var(--ok) }
textarea { resize:vertical; min-height:96px }
.scroll { overflow-x:auto; max-width:100% } table { border-collapse:collapse; font-size:.85rem; width:100% } td,th { border-bottom:1px solid rgba(203,187,175,.2); padding:7px 8px; text-align:left; vertical-align:top } td.n { text-align:right; white-space:nowrap }
pre.sketch { font:500 .75rem/1.35 ui-monospace,Consolas,monospace; margin:0; overflow-x:auto; background:var(--sunk); padding:10px; border-radius:12px }
.bar2 { height:6px; border-radius:3px; background:var(--tile); overflow:hidden } .bar2 i { display:block; height:100%; background:var(--gold) }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px }
.big { font-size:1.7rem; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.15 }
.qbtn { width:48px; height:48px; flex:none; border-radius:50%; background:var(--brown); border:0; font-size:1.4rem; display:grid; place-items:center } .q500 { height:48px; padding:0 14px; flex:none; border-radius:99px; background:none; border:1px solid var(--line); color:var(--gold); font-weight:500 }
.fab { position:fixed; right:max(16px,env(safe-area-inset-right,0px)); bottom:calc(92px + env(safe-area-inset-bottom,0px)); width:60px; height:60px; border-radius:18px; background:var(--amber); color:#fff; border:0; font-size:2rem; display:grid; place-items:center; z-index:5 }
nav { position:fixed; inset:auto 0 0; background:var(--bar); padding:8px max(4px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px)); z-index:7 }
nav div { display:flex; max-width:680px; margin:0 auto }
nav button { flex:1 1 0; min-width:0; background:none; border:0; display:grid; justify-items:center; gap:3px; font-size:.75rem; font-weight:500; padding:0 }
nav span.w { position:relative; width:58px; height:30px; border-radius:15px; display:grid; place-items:center }
nav button[aria-current="page"] span.w { background:var(--brown-soft) } nav button[aria-current="page"] svg { color:#FFD9A8 }
nav sup { position:absolute; top:-5px; right:6px; min-width:17px; height:17px; border-radius:9px; background:var(--bad); color:#fff; font-size:.68rem; line-height:17px; text-align:center }
</style>

<header class="top" id="top"><span class="logo" id="logo"></span><span class="tt"><b>BakeScale</b></span></header>
<main id="main"><section class="panel"><b>Tes recettes arrivent.</b><span class="small muted">L'application lit ta Google Sheet et affiche ensuite tes fiches, tes tâches et ton stock.</span></section></main>

<script>
/*PARSER-START*/
const T = v => v == null ? '' : String(v).trim();
const num = v => {
  if (typeof v === 'number') return v;
  const s = T(v).replace(/\s/g, '').replace(',', '.');
  return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : null;
};
const norm = s => T(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/œ/g, 'oe').replace(/\s+/g, ' ');
function displayName(tab) {
  const t = T(tab).replace(/\s+/g, ' ');
  return /^R\.\s*/i.test(t) ? t.replace(/^R\.\s*/i, '') : t;
}
const weighs = x => /^(g|ml)$/i.test(T(x.unit));
const isBaseTab = tab => /\bbase\b/i.test(T(tab));
function findRow(rows, re, from = 0) {
  for (let i = from; i < rows.length; i++) if (re.test(T(rows[i] && rows[i][0]))) return i;
  return -1;
}
function parseRecipe(title, id, rows) {
  if (!/^Fiche Recette/i.test(T(rows[0] && rows[0][0]))) return null;
  const r = { id: String(id), tab: title, name: displayName(title), isBase: isBaseTab(title), issues: [] };
  const baseRow = findRow(rows, /calibr[ée]e pour/i);
  r.baseText = baseRow >= 0 ? T(rows[baseRow][0]).split(':').slice(1).join(':').trim() : '';
  const srcRow = findRow(rows, /^Lien Tutoriel/i);
  r.source = srcRow >= 0 ? T(rows[srcRow][1]) : '';
  const sr = findRow(rows, /^Saisir/i), hr = findRow(rows, /^Sous-Ensemble/i);
  if (sr < 0) r.issues.push('Ligne « Saisir… » introuvable');
  if (hr < 0) { r.issues.push('En-tête « Sous-Ensemble / Ingrédient » introuvable'); r.blocks = []; return r; }
  const sect = /^(\d+\.\s*)?(Sch[ée]ma|Guide de Fabrication)|^---/i;
  let end = findRow(rows, sect, hr + 1); if (end < 0) end = rows.length;
  const h = rows[hr].map(T);
  const ratio = /ratio/i.test(h[1] || '');
  let qcol = 1, ucol = 2, ref = null;
  if (ratio) {
    qcol = h.findIndex(x => /^Pour\s+\d+\s*Indiv/i.test(x));
    ref = qcol >= 0 ? num(h[qcol].match(/^Pour\s+(\d+)/i)[1]) : null;
    ucol = -1;
    if (qcol < 0) r.issues.push('Colonne « Pour N Indiv » introuvable');
  } else {
    const m = (h[1] || '').match(/\((\d+(?:[.,]\d+)?)/);
    if (m) ref = num(m[1]);
    else { const a = r.baseText.match(/\d+(?:[.,]\d+)?/); if (a) ref = num(a[0]); }
  }
  if (!ref) r.issues.push('Quantité de référence introuvable');
  r.ref = ref;
  const tsCol = h.findIndex(x => /timestamp/i.test(x)), noteCol = h.findIndex(x => /remarques|proc[ée]d/i.test(x));
  const s = sr >= 0 ? rows[sr] : [];
  const sa = T(s[0]);
  r.defaultQty = num(s[3]) || ref || 1;
  r.qtyLabel = sa.replace(/^Saisir\s+(le |la )?/i, '').replace(/\s*:\s*$/, '').replace(/^./, c => c.toUpperCase());
  r.unit = T(s[4]) || (/poids/i.test(sa) ? 'g' : ((sa.match(/nombre\s+d(?:e\s+|['’])([^\s:(]+)/i) || [])[1] || ''));
  const blocks = []; let cur = null;
  for (let i = hr + 1; i < end; i++) {
    const row = rows[i] || [], n = T(row[0]);
    if (!n || /^total/i.test(n)) continue;
    const q = num(row[qcol]);
    if (q == null) {
      if (n.length <= 90 && !row.slice(1).some(c => T(c))) { cur = { name: n, items: [] }; blocks.push(cur); }
      continue;
    }
    if (!cur) { cur = { name: 'Ingrédients', items: [] }; blocks.push(cur); }
    cur.items.push({ name: n, qty: q, unit: ucol >= 0 ? T(row[ucol]) : 'g', note: noteCol >= 0 ? T(row[noteCol]) : '', t: tsCol >= 0 ? tSec(row[tsCol]) : null });
  }
  r.blocks = blocks.filter(b => b.items.length);
  r.baseWeight = r.blocks.flatMap(b => b.items).filter(weighs).reduce((a, x) => a + x.qty, 0);
  let gi = -1;
  rows.forEach((row, i) => { if (/^(\d+\.\s*)?Guide de Fabrication/i.test(T(row && row[0]))) gi = i; });
  r.steps = [];
  if (gi >= 0) for (let i = gi + 1; i < rows.length; i++) {
    const a = T(rows[i] && rows[i][0]);
    if (/^---/.test(a)) break;
    const m = a.match(/^(\d+)\.\s+([\s\S]*)$/);
    if (!m) continue;
    let text = m[2], t = tSec(rows[i][4]);
    const inl = text.match(/\[[^\]]*t=(\d+)s[^\]]*\]/);
    if (inl) { if (t == null) t = +inl[1]; text = text.replace(inl[0], '').trim(); }
    const cut = text.indexOf(' : ');
    r.steps.push({ title: cut > 0 && cut < 70 ? text.slice(0, cut) : '', text: cut > 0 && cut < 70 ? text.slice(cut + 3) : text, t });
  }
  r.layers = []; r.sketch = [];
  const ci = findRow(rows, /^\d+\.\s*Sch[ée]ma/i);
  if (ci >= 0) {
    let stop = findRow(rows, /^(\d+\.\s*)?Guide de Fabrication|^---/i, ci + 1); if (stop < 0) stop = rows.length;
    for (let i = ci + 2; i < stop; i++) {
      const row = rows[i] || [];
      if (T(row[0])) r.layers.push({ level: T(row[0]), comp: T(row[1]), role: T(row[2]), desc: T(row[3]) });
      if (row[4] != null && T(row[4])) r.sketch.push(String(row[4]));
    }
  }
  r.legend = [];
  const li = findRow(rows, /^---\s*SCH/i);
  if (li >= 0) for (let i = li + 2; i < rows.length; i++) {
    const row = rows[i] || [];
    if (/^#[0-9a-f]{3,8}$/i.test(T(row[3]))) r.legend.push({ level: T(row[0]), comp: T(row[1]), role: T(row[2]), color: T(row[3]) });
  }
  r.formats = [];
  const fi = findRow(rows, /^1\.\s*Tableau/i);
  if (fi >= 0) for (let i = fi + 1; i < rows.length; i++) {
    const row = rows[i] || [], a = T(row[0]);
    if (/^Total\s*:/i.test(a) || /^2\./.test(a)) break;
    if (row.some(c => T(c))) r.formats.push(row.slice(0, 9).map(c => c == null ? '' : c));
  }
  r.options = formatOptions(r);
  return r;
}
/* Turns the sheet's format table into choices for the scaler, only where a row maps to a real quantity. */
function formatOptions(r) {
  const u = norm(r.unit), head = r.formats[0] || [], out = [];
  const pick = (a, re) => { const m = a.match(re); return m ? +m[1] : null; };
  for (const row of r.formats) {
    const label = T(row[0]), a = norm(label);
    if (!label || /^format$/i.test(label)) continue;
    let q = null;
    if (u.startsWith('personne')) q = pick(a, /(\d+)\s*pers/) ?? pick(a, /\((\d+)/) ?? (/individuel/.test(a) ? 1 : null);
    else if (u.startsWith('piece')) q = pick(a, /(\d+)\s*pcs?\b/);
    else if (u.startsWith('gobelet')) q = pick(a, /(\d+)\s*gobelet/);
    else if (u.startsWith('individuel')) q = /individuel/.test(a) ? 1 : null;
    else if (u === 'g') q = num(row[1]);
    else if (/poids net/i.test(T(head[1])) && num(row[1]) && r.baseWeight) q = +(r.ref * num(row[1]) / r.baseWeight).toFixed(3);
    if (!q) continue;
    const size = /cm\b/i.test(label) ? '' : (row.slice(1).map(T).find(c => /\d\s*cm\b/i.test(c)) || '');
    out.push({ label, size, qty: q });
  }
  return out.length >= 2 ? out : [];
}
function tSec(v) { const m = T(v).match(/t=(\d+)s/); return m ? +m[1] : null; }
function gridRows(sheet) {
  const d = sheet.data && sheet.data[0];
  return ((d && d.rowData) || []).map(row => (row.values || []).map(c => {
    const e = c && c.effectiveValue;
    return !e ? null : (e.stringValue ?? e.numberValue ?? e.boolValue ?? null);
  }));
}
const STOP = new Set(['avec', 'pour', 'dans', 'sans', 'base', 'vanille', 'bourbon', 'cuisson', 'finition', 'montage', 'decor', 'creme']);

const unitKey = u => { const n = norm(u).replace(/s$/, ''); return n === 'gousse' || n === 'citron' ? 'piece' : n === 'ml' ? 'g' : n; };

}

function freeBlocks() { const out = []; for (const p of S.productions) if (!p.finished) p.blocks.forEach((b, i) => { if (!assignee(p, i).id) out.push({ p, b, i }); }); return out; }

/* ---------- Stocks ---------- */
const isLow = s => s.min != null && s.qty != null && s.qty <= s.min;
const stepFor = s => { if (s.step) return [s.step, s.big || s.step * 5]; const n = norm(s.unit); return n === 'g' || n === 'ml' ? [100, 500] : n === 'kg' || n === 'l' ? [0.1, 0.5] : [1, 10]; };
const buyTerm = s => encodeURIComponent(T(s.name).replace(/\s*\(.*?\)/g, ''));
function buyLinks(s) {
  const best = s.pa != null && s.pm != null ? (s.pa <= s.pm ? 'a' : 'm') : null;
  const az = s.asin ? 'https://www.amazon.fr/gp/aws/cart/add.html?ASIN.1=' + encodeURIComponent(s.asin) + '&Quantity.1=1' : 'https://www.amazon.fr/s?k=' + buyTerm(s);

}

  async accept(d, el) { el.disabled = true; try { await run('api_accept'); S.accepted = true; S.reread = false; try { speechSynthesis.cancel(); } catch (e) {} await refreshBoard(); } catch (e) { el.disabled = false; S.busy = 'La validation n\'a pas été enregistrée. ' + sheetErrorText(e); render(); } },
  reread() { S.reread = !S.reread; render(); window.scrollTo(0, 0); },

  step(d) { const r = recipeById(S.tab), q = qtyOf(r), s = q >= 100 || norm(r.unit) === 'g' ? (q >= 1000 ? 100 : 50) : 1; S.qty[r.id] = Math.max(s, q + s * +d.d); render(); },
  mult(d) { const s = selOf(recipeById(S.tab)); s.m = Math.max(1, s.m + +d.d); render(); },
  multset(d) { selOf(recipeById(S.tab)).m = +d.n; render(); },
  fmt(d) { const r = recipeById(S.tab), s = selOf(r), q = qtyOf(r); s.f = +d.i; if (s.f < 0) S.qty[r.id] = q; render(); },
  prep() { S.prep = !S.prep; render(); },
  async cook() { if (S.cooking) { try { await S.cooking.release(); } catch {} S.cooking = null; } else { try { S.cooking = await navigator.wakeLock.request('screen'); } catch { S.busy = 'Cet écran ne peut pas rester allumé depuis la page.'; } } render(); },
  check(d, el) { store.set(d.k, el.checked); el.closest('.ing').classList.toggle('done', el.checked); },
  draft() { const r = recipeById(S.tab); S.draft = { tabId: r.id, qty: qtyOf(r), date: new Date().toISOString().slice(0, 10), assign: {} }; S.view = 'tasks'; S.finish = null; render(); window.scrollTo(0, 0); },
  'draft-cancel'() { S.draft = null; S.view = 'dose'; render(); },
  hit(d) { const a = S.draft.assign; a[d.i] = { id: d.id, label: d.name }; document.querySelector(`[data-assign="${d.i}"]`).value = d.name; $('hits-' + d.i).innerHTML = ''; },
  async 'draft-save'() {
    const d = S.draft, r = recipeById(d.tabId);
    d.qty = num($('d-qty').value) || d.qty; d.date = $('d-date').value || d.date;
    const f = d.qty / r.ref, assign = {};
    Object.entries(d.assign).forEach(([i, a]) => { if (a.id) assign[i] = { id: a.id }; else if (T(a.label)) assign[i] = { label: T(a.label) }; });
    const doc = { recipeId: r.id, recipeName: r.name, qty: d.qty, unit: r.unit, date: d.date, createdAt: Date.now(), source: r.source || '', legend: r.legend, layers: r.layers, sketch: r.sketch, steps: r.steps, assign, finished: false,
      blocks: r.blocks.map(b => ({ name: b.name, items: b.items.map(it => ({ name: it.name, qty: +(it.qty * f).toFixed(3), unit: it.unit, note: it.note })), steps: stepsForBlock(b.name, r.steps) })) };
    try { await run('api_saveProduction', doc); S.draft = null; S.seg = 'prods'; await refreshBoard(); }
    catch (e) { S.busy = 'La production n\'a pas pu être créée. ' + sheetErrorText(e); render(); }
  },
  finish(d) { S.finish = d.id; render(); window.scrollTo(0, 0); },
  'finish-cancel'() { S.finish = null; render(); },
  async 'stock-add'(d) { const p = S.productions.find(x => x.id === S.finish), l = deductionPlan(p).filter(x => !x.ok)[+d.i]; await addStockRow(l.name, 0, l.unit, null); },
  async 'finish-go'(d, el) {
    el.disabled = true;
    const p = S.productions.find(x => x.id === S.finish);
    try {
      await run('api_finishProduction', p.id, deductionPlan(p).filter(x => x.ok).map(l => ({ row: l.row.row, name: l.row.name, qty: l.qty })));
      S.finish = null; S.seg = 'hist'; await refresh();
    } catch (e) { el.disabled = false; S.busy = 'Le stock n\'a peut-être pas été entièrement mis à jour. Vérifie App_Stock avant de réessayer. ' + sheetErrorText(e); render(); }
  },
  async 'prod-del'(d, el) { if (el.dataset.sure) { await run('api_deleteProduction', d.id); await refreshBoard(); } else { el.dataset.sure = '1'; el.textContent = 'Confirmer la suppression'; } },
  async state(d) { await setStatus(d.p, d.i, { state: d.s }); },
  async claim(d) { await setStatus(d.p, d.i, { claim: true }); },
  onlylow() { S.onlyLow = !S.onlyLow; render(); },
  cat(d) { S.stockCat = d.v; render(); },
  'add-toggle'() { S.addOpen = !S.addOpen; render(); if (S.addOpen) window.scrollTo(0, 0); },
  sq(d) { const s = S.stock.find(x => x.row === +d.r); if (!s) return; s.qty = Math.max(0, +(((s.qty || 0) + +d.d).toFixed(3))); queueCell('stock', s.row, s.qty); render(); },
  mq(d) { const m = S.mat.find(x => x.row === +d.r); if (!m) return; m.qty = Math.max(0, (m.qty || 0) + +d.d); queueCell('mat', m.row, m.qty); render(); },
  async 'stock-new'() { const n = T($('n-name').value); if (!n) return; const q = num($('n-qty').value) ?? 0, u = T($('n-unit').value) || 'g', mn = num($('n-min').value); document.activeElement && document.activeElement.blur(); S.addOpen = false; await addStockRow(n, q, u, mn); },
};
async function addStockRow(name, qty, unit, min) {
  try { await run('api_addStock', name, qty, unit, min == null ? null : min); await refresh(); }
  catch (e) { S.busy = 'L\'ingrédient n\'a pas pu être ajouté. ' + sheetErrorText(e); render(); }
}
function hookAudio() {
  const a = $('chef-audio'); if (!a) return;
  a.addEventListener('play', () => { S.playing = true; });
  a.addEventListener('pause', () => { S.playing = false; });
  a.addEventListener('ended', () => { S.playing = false; S.heard = true; render(); hookAudio(); });
}
async function setStatus(pid, i, patch) {
  try { await run('api_status', pid, +i, patch); await refreshBoard(); }
  catch (e) { S.busy = 'Ta modification n\'a pas été enregistrée. ' + sheetErrorText(e); render(); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.type === 'checkbox') return;
  const fn = ACT[el.dataset.act]; if (fn) { if (el.dataset.act !== 'images') S.busy = ''; fn(el.dataset, el); }
});
document.addEventListener('change', async e => {
  const el = e.target, d = el.dataset;
  if (d.act === 'check') return ACT.check(d, el);
  if (el.id === 'qty') { const r = recipeById(S.tab), v = num(el.value); if (v > 0) S.qty[r.id] = v; el.blur(); render(); return; }
  if (d.comment) { const [p, i] = d.comment.split('~'); el.blur(); await setStatus(p, i, { comment: T(el.value) }); }
});
document.addEventListener('input', async e => {
  const el = e.target, d = el.dataset;
  if (el.id === 'search') { S.q = el.value; $('list').innerHTML = recipeList(); return; }
  if (el.id === 'stock-q') { S.stockQ = el.value; $('stock-list').innerHTML = stockList(); return; }
  if (/^inv-/.test(el.id)) { const k = { 'inv-name': 'name', 'inv-phone': 'phone', 'inv-mail': 'mail', 'inv-msg': 'msg' }[el.id]; S.inv[k] = el.value; if ($('inv-wa')) { $('inv-wa').href = waLink(); $('inv-gm').href = mailLink(); } return; }
  if (d.assign !== undefined) { S.draft.assign[d.assign] = el.value ? { id: el.value } : {}; }
});
document.addEventListener('focusout', () => setTimeout(() => { if (S.dirty) render(); }, 0));

async function boot() {
  if (!TOKEN) { $('top').hidden = true; $('main').innerHTML = '<div class="panel" style="margin-top:24px"><b>Ce lien n\'est pas valide.</b><span class="small muted">Demande un nouveau lien à la personne qui t\'a invité.</span></div>'; return; }
  const c = store.get('cache', null), known = store.get('cacheToken', '') === TOKEN;
  if (c && known) { S.owner = true; S.view = 'home'; S.recipes = c.recipes || []; S.stock = c.stock || []; S.mat = c.mat || []; S.cmp = c.cmp || S.cmp; S.syncedAt = c.at || null; render(); }
  await refresh();
  if (S.owner) { store.set('cacheToken', TOKEN); if (!known) S.view = 'home'; } else S.view = 'tasks';
  render();
  setInterval(async () => {
    if (document.hidden) return;
    if (S.owner) { try { const r = await run('api_rev'); if (r !== S.rev) await refresh(); } catch (e) {} }
    else refreshBoard();
  }, S.owner ? 60000 : 30000);
  if (S.owner) setInterval(async () => { if (document.hidden) return; try { const before = S.calls.filter(c => !c.ack).length; S.calls = await run('api_calls'); alertNewCalls(); if (S.calls.length !== before) render(); } catch (e) {} }, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (S.owner) refresh(); else refreshBoard(); } });
}
drawTop();
boot();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

</script>
</body>
